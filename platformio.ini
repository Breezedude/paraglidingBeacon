; Breezedude Beacon for the SenseCAP T1000-E
;
;   MCU    Nordic nRF52840, SoftDevice S140 7.3.0, UF2 bootloader
;   Radio  Semtech LR1110
;   GNSS   Airoha AG3335
;   Motion QMA6100P on I2C 0x12
;
; Build with:  pio run -e t1000e
; Run the protocol tests on the host with:  pio test -e native

[env:t1000e]
; Pinned, like the libraries below: the radio driver depends on RadioLib's
; LR11x0 interface, and the linker script on the core's memory layout. Newer
; versions are worth trying, but deliberately rather than by accident.
platform  = nordicnrf52@10.12.0
framework = arduino

; boards/t1000e.json. It selects the SoftDevice the device is delivered with,
; so the resulting UF2 installs directly, the linker script that goes with it
; (linker/), and the board variant (variants/). The variant is required: the
; core translates Arduino pin numbers through a table and discards anything
; above its pin count.
board = t1000e

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCFG_DEBUG=0
    ; The core's receive buffer for the GNSS port holds 64 bytes, which is
    ; under six milliseconds at this baud rate. Anything that keeps the main
    ; loop busy for longer loses part of the position report.
    -DSERIAL_BUFFER_SIZE=1024

lib_deps =
    jgromes/RadioLib@7.7.1
    mikalhart/TinyGPSPlus@1.1.0
    bblanchon/ArduinoJson@7.4.3

; Produces firmware.uf2 alongside the usual outputs.
extra_scripts = post:uf2_postbuild.py

monitor_speed = 115200

; ---------------------------------------------------------------------------
; Host tests for everything that depends only on the standard library and
; therefore compiles without any hardware or framework headers.
[env:native]
platform = native
build_flags =
    -std=c++17
    -I src
    ; Coordinates are compared as doubles, which the test framework only
    ; supports when this is defined.
    -D UNITY_INCLUDE_DOUBLE
build_src_filter =
    +<proto/>
    +<airtime.cpp>
    +<battery.cpp>
    +<flight_state.cpp>
    +<gnss_filter.cpp>
    +<rx_cache.cpp>
    +<sha256.cpp>
    +<slot_clock.cpp>
test_framework = unity
