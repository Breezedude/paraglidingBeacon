  @media (prefers-color-scheme: dark){
    :root:not([data-theme=light]){
      --bg:#0f1319; --card:#161b23; --sunk:#0b0e13;
      --line:#262d38; --line-soft:#1e242d;
      --text:#e7eaf0; --muted:#9ba5b4; --faint:#6c7686;
      --accent:#6aa5ff; --accent-weak:rgba(106,165,255,.12); --on-accent:#0b0f15;
      --warn:#fbbf24; --danger:#f87171; --danger-weak:rgba(248,113,113,.12); --ok:#4ade80;
      --track:#38414f;
      --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  [data-theme=dark]{
    --bg:#0f1319; --card:#161b23; --sunk:#0b0e13;
    --line:#262d38; --line-soft:#1e242d;
    --text:#e7eaf0; --muted:#9ba5b4; --faint:#6c7686;
    --accent:#6aa5ff; --accent-weak:rgba(106,165,255,.12); --on-accent:#0b0f15;
    --warn:#fbbf24; --danger:#f87171; --danger-weak:rgba(248,113,113,.12); --ok:#4ade80;
    --track:#38414f;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}

  /* The logo is a mask filled with the text colour, so it follows the theme
     without a second image or an inverting filter. */
  .mark{display:block;flex:none;background:var(--text);
    -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}

  header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:.75rem;padding:max(.5rem,env(safe-area-inset-top)) max(1rem,calc(50% - 300px + 1rem)) .5rem;
    background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft)}
  .brand{display:flex;align-items:center;gap:.6rem;min-width:0}
  .brand .mark{width:36px;height:36px}
  .brand>span{min-width:0}
  .brand b{display:block;font-weight:650;letter-spacing:-.01em;font-size:.98rem;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{display:flex;align-items:center;gap:.4rem;color:var(--muted);font-size:.76rem;
    white-space:nowrap}
  .led{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}
  body:not(.off) .brand .led{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
  body.pending .brand .led{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
  .saved{color:var(--ok);opacity:0;transition:opacity .2s}
  .saved.on{opacity:1}

  .tools{display:flex;gap:.4rem;flex:none}
  .iconbtn{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:10px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;
    transition:border-color .15s,color .15s,background-color .15s}
  .iconbtn:hover{color:var(--text);border-color:var(--track)}
  .iconbtn:active{transform:scale(.95)}
  .iconbtn:focus-visible,.btn:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .iconbtn.lang{font-size:.74rem;font-weight:700;letter-spacing:.04em}
  /* Ending the connection is the one destructive control up here, and is
     coloured as such so it is not taken for a setting. */
  .iconbtn.hangup{color:var(--danger);background:var(--danger-weak);
    border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
  .iconbtn.hangup:hover{color:var(--danger);border-color:var(--danger)}
  @media (max-width:440px){
    header{gap:.5rem}
    .brand{gap:.5rem}
    .brand .mark{width:30px;height:30px}
    .brand b{font-size:.88rem}
    .tools{gap:.3rem}
    .iconbtn{width:34px;height:34px;border-radius:9px}
  }
  #themeBtn .sun{display:none}
  [data-theme=dark] #themeBtn .sun{display:block}
  [data-theme=dark] #themeBtn .moon{display:none}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme=light]) #themeBtn .sun{display:block}
    :root:not([data-theme=light]) #themeBtn .moon{display:none}
  }

  /* width:100% is load bearing: main is a flex item and the auto side margins
     would otherwise shrink it to its content, which shows on the connect view. */
  main{width:100%;max-width:600px;margin:0 auto;padding:.85rem 1rem calc(2rem + env(safe-area-inset-bottom))}
  body.off,body.pending{display:flex;flex-direction:column;min-height:100dvh}
  body.off main,body.pending main{flex:1;display:flex;flex-direction:column;justify-content:center}
  body.off .only-on{display:none}
  body:not(.off) .only-off{display:none}
  /* Connected but not confirmed: neither the connect button nor the settings
     belong on screen, only the request to press the button on the device. */
  body.pending .only-on{display:none}
  body.pending .only-off{display:none}
  body:not(.pending) .only-pending{display:none}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);margin:0 0 .7rem;overflow:hidden}
  .card>.pad{padding:.85rem .95rem}

  .hero{display:flex;flex-direction:column;align-items:center;gap:1.6rem;padding:0 0 12vh}
  .hero .mark{width:min(46vw,168px);height:min(46vw,168px);opacity:.92}
  .hero .btn{max-width:20rem}

  .confirm{padding:1.9rem 1.25rem 1.6rem;text-align:center}
  .confirm h1{margin:1.1rem 0 .5rem;font-size:1.1rem;font-weight:650}
  .confirm p{margin:0 auto .7rem;color:var(--muted);font-size:.9rem;max-width:26rem;line-height:1.45}
  .confirm .note{font-size:.82rem;color:var(--faint)}
  /* A button being pressed: the ring is the finger arriving. */
  .press{position:relative;width:58px;height:58px;margin:0 auto}
  .press::before,.press::after{content:"";position:absolute;inset:0;border-radius:50%}
  .press::before{inset:14px;background:var(--accent)}
  .press::after{border:2px solid var(--accent);animation:press 1.6s ease-out infinite}
  @keyframes press{0%{transform:scale(1.25);opacity:0}35%{opacity:.9}100%{transform:scale(.52);opacity:0}}
  @media (prefers-reduced-motion:reduce){ .press::after{animation:none;opacity:.5} }

  /* Section labels are set apart from body text: small, spaced, uppercase. */
  .seclabel{margin:1.3rem .25rem .5rem;font-size:.7rem;font-weight:700;letter-spacing:.11em;
    text-transform:uppercase;color:var(--faint)}
  .seclabel.first{margin-top:.35rem}

  /* Accordions keep the page short. */
  details.card>summary{list-style:none;cursor:pointer;padding:.7rem .95rem;
    display:flex;align-items:center;gap:.7rem;font-weight:600}
  details.card>summary::-webkit-details-marker{display:none}
  details.card>summary::after{content:"";margin:0 .15rem 3px auto;width:8px;height:8px;flex:none;
    border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);
    transform:rotate(45deg);transition:transform .18s}
  details.card[open]>summary::after{transform:rotate(225deg);margin-bottom:-3px}
  details.card[open]>summary{border-bottom:1px solid var(--line-soft)}
  details.card>summary:hover .ico{background:color-mix(in srgb,var(--accent) 16%,transparent)}
  summary .tally{margin-left:auto;color:var(--muted);font-weight:400;font-size:.85rem}
  summary .tally+*{margin-left:0}
  details.card>summary:has(.tally:not(:empty))::after{margin-left:.5rem}
  details.card[open]>summary .tally{visibility:hidden}
  summary .ico{color:var(--accent);background:var(--accent-weak);flex:none;display:grid;place-items:center;
    width:32px;height:32px;border-radius:9px;transition:background-color .15s}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-soft)}
  .stat{background:var(--card);padding:.7rem .95rem}
  .stat>span{display:block;color:var(--muted);font-size:.76rem;margin-bottom:.15rem}
  .stat b{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:1.02rem;font-weight:620;
    font-variant-numeric:tabular-nums}

function detectLanguage(){
  const saved = localStorage.getItem('bd-lang');
  if (TEXT[saved]) return saved;
  for (const tag of (navigator.languages && navigator.languages.length
                     ? navigator.languages : [navigator.language || 'en'])){
    const code = String(tag).toLowerCase().slice(0, 2);
    if (TEXT[code]) return code;
  }
  return 'en';
}

let lang = detectLanguage();

// Looks a text up and fills in {0}, {1}, ... from the arguments.
function t(key, ...args){
  const s = TEXT[lang][key];
  return typeof s === 'string' ? s.replace(/\{(\d)\}/g, (_, i) => args[i]) : s;
}

// Everything that depends on the language and was not written into the page by
// an attribute is redrawn by these, registered where the pieces are defined.
const redraw = [];

function applyLanguage(){
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-i18n]'))      el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-html]')) el.innerHTML   = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll('[data-i18n-title]')){
    el.title = t(el.dataset.i18nTitle);
    el.setAttribute('aria-label', el.title);
  }
  // The button shows the language it switches to.
  $('langBtn').textContent = lang === 'de' ? 'EN' : 'DE';
  for (const fn of redraw) fn();
}

$('langBtn').onclick = () => {
  lang = lang === 'de' ? 'en' : 'de';
  localStorage.setItem('bd-lang', lang);
  applyLanguage();
};

// ---- theme -----------------------------------------------------------------
// Three states: explicit light, explicit dark, or follow the system.
(function(){
  const saved = localStorage.getItem('bd-theme');
  if (saved) document.documentElement.dataset.theme = saved;
  $('themeBtn').onclick = () => {
    const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
    const cur  = document.documentElement.dataset.theme || (sysDark ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('bd-theme', next);
  };
})();

function toast(msg, ms = 1700){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), ms);
}

// ---- debug console ---------------------------------------------------------
// Off by default and hidden entirely: it is for working out why something does
// not behave, not for normal use. The choice is remembered like the theme.
const DBG_MAX = 300;
let dbgOn = localStorage.getItem('bd-debug') === '1';

function setDebug(on){
  dbgOn = on;
  localStorage.setItem('bd-debug', on ? '1' : '0');
  $('dbgBox').hidden = !on;
  $('dbgBtn').textContent = t(on ? 'dbgHide' : 'dbgShow');
  if (on) $('dbgBox').open = true;
}

const stamp = () => {
  const d = new Date();
  return d.toTimeString().slice(0, 8) + '.' +
         String(d.getMilliseconds()).padStart(3, '0');
};

function dbg(dir, text){
  if (!dbgOn) return;
  if (dir === 'out' && !$('dbgTx').checked) return;
  if (dir === 'in'  && !$('dbgRx').checked) return;

  const box = $('dbgLog');
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();

  // Stick to the bottom only while the reader is already there, so scrolling
  // back through the log is not fought by every new line.
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;

  const line = document.createElement('span');
  line.className = 'l ' + dir;
  const arrow = dir === 'out' ? '→' : '←';
  line.innerHTML = '<span class=t>' + stamp() + '</span> ' +
                   '<span class=d>' + arrow + '</span> ';
  line.appendChild(document.createTextNode(String(text).replace(/[\r\n]+$/, '')));
  box.appendChild(line);

  while (box.childElementCount > DBG_MAX) box.removeChild(box.firstElementChild);
  $('dbgTally').textContent = box.childElementCount;

  if (atBottom) box.scrollTop = box.scrollHeight;
}

function dbgClear(){
  const empty = document.createElement('span');
  empty.className = 'empty';
  empty.textContent = t('dbgEmpty');
  $('dbgLog').replaceChildren(empty);
  $('dbgTally').textContent = '';
}

$('dbgBtn').onclick   = () => setDebug(!dbgOn);
$('dbgNmea').onchange = () => listenNmea($('dbgNmea').checked);
$('dbgClear').onclick = dbgClear;

redraw.push(() => {
  $('dbgBtn').textContent = t(dbgOn ? 'dbgHide' : 'dbgShow');
  const empty = $('dbgLog').querySelector('.empty');
  if (empty) empty.textContent = t('dbgEmpty');
});

// ---- BLE -------------------------------------------------------------------
// Two services. This page talks on the configuration service, one JSON object
// per line each way. The serial service carries the NMEA stream for navigation
// apps; the debug console can listen in on it.
const CFG_SVC = '88c00001-13a4-4aab-998f-26ee246f7e7b',
      CFG_RX  = '88c00002-13a4-4aab-998f-26ee246f7e7b',   // we write here
      CFG_TX  = '88c00003-13a4-4aab-998f-26ee246f7e7b',   // notifications
      NUS     = '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
      NUS_TX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

const PROTOCOL = 1;

// The smallest packet every link carries. The device says in its greeting how
// much more this one takes.
const CHUNK_MIN = 20, CHUNK_MAX = 244;

let dev = null, rxChar = null, nmeaChar = null, chunk = CHUNK_MIN;

// ---- key -------------------------------------------------------------------
// The beacon lets a client configure it once the client has shown that it
// holds a key the beacon handed out, and it hands one out only after a press
// on its button. The key is kept here, per beacon, and never sent back: each
// connection the beacon sends a number and gets the HMAC of it in return.
let deviceId = '', keyTried = false, pairAsked = false;

const keySlot = id => 'bd-key-' + id;
function loadKey(id){
  try { return id ? localStorage.getItem(keySlot(id)) : null; } catch(e){ return null; }
}
function saveKey(id, key){
  try { if (id) localStorage.setItem(keySlot(id), key); } catch(e){ /* pairs again next time */ }
}

const fromHex = text => new Uint8Array((text.match(/../g) || []).map(b => parseInt(b, 16)));
const toHex   = data => [...data].map(b => b.toString(16).padStart(2, '0')).join('');

async function answerChallenge(keyHex, nonceHex){
  const key = await crypto.subtle.importKey(
    'raw', fromHex(keyHex), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return toHex(new Uint8Array(await crypto.subtle.sign('HMAC', key, fromHex(nonceHex))));
}

// One operation at a time: some platforms refuse a second one while the first
// is still in the air, and two messages written at once would interleave.
let gattTail = Promise.resolve();
function queued(op){
  const run = gattTail.then(op, op);
  gattTail = run.catch(() => {});
  return run;
}

function send(obj){
  return queued(async () => {
    if (!rxChar) return;
    const text = JSON.stringify(obj);
    dbg('out', text);
    const data = new TextEncoder().encode(text + '\n');
    // The firmware reassembles on the newline.
    for (let i = 0; i < data.length; i += chunk){
      const part = data.slice(i, i + chunk);
      try      { await rxChar.writeValueWithoutResponse(part); }
      catch(e) { await rxChar.writeValueWithResponse(part); }
    }
  });
}

// Turns notifications into lines. The decoder is kept between packets, so a
// character split across two of them still comes out whole.
function lineReader(onText){
  const decoder = new TextDecoder();
  let buf = '';
  return e => {
    buf += decoder.decode(e.target.value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (line) onText(line);
    }
    if (buf.length > 4000) buf = '';
  };
}

// ---- link state ------------------------------------------------------------
let awaitingAuth = false;
let firmware = '';
let hasMotion = true;

function renderLink(){
  const on = !document.body.classList.contains('off');
  $('devSub').textContent = !on ? t('notConnected')
                          : awaitingAuth ? t('awaiting')
                          : t('connected') + (firmware ? ' · ' + firmware : '');
}
redraw.push(renderLink);

function setConnected(on, name){
  document.body.classList.toggle('off', !on);
  $('linkBtn').hidden = !on;
  $('devName').textContent = on ? (name || 'Beacon') : 'Breezedude Beacon';
  if (!on){
    firmware = '';
    setPending(false);
    rxChar = null;
    nmeaChar = null;
    chunk = CHUNK_MIN;
    keyTried = pairAsked = false;
    lastStatus = null;
    rxSeen.clear();
    renderReceptions();
  }
  renderLink();
}

function setPending(on){
  awaitingAuth = on;
  document.body.classList.toggle('pending', on);
  renderLink();
}

// What the beacon says while this page is not let in yet.
async function onAuth(m){
  if (m.ok){
    // Let in. A key comes along only when it is a new one.
    if (m.key) saveKey(deviceId, m.key);
    setPending(false);
    hello();
    return;
  }
  // Repeated while it waits for its button, so this has to be idempotent.
  if (m.wait){ setPending(true); return; }

  // A challenge: answer it with the key on file, once. Without a key, or
  // with one the beacon no longer accepts, ask for a new one, which is what
  // makes the beacon want its button pressed.
  if (m.dev) deviceId = m.dev;
  const key = loadKey(deviceId);
  if (key && !keyTried && m.nonce){
    keyTried = true;
    try {
      send({ cmd: 'auth', mac: await answerChallenge(key, m.nonce) });
      return;
    } catch(e){ /* a key that cannot be used is as good as none */ }
  }
  if (!pairAsked){
    pairAsked = true;
    setPending(true);
    send({ cmd: 'pair' });
  }
}

// Opens the session. A beacon that has not let this page in yet answers with
// a challenge instead, and the greeting is sent again once that is settled.
function hello(){
  chunk = CHUNK_MIN;
  return send({ cmd: 'hello', v: PROTOCOL });
}

function onHello(m){
  setPending(false);
  chunk = Math.max(CHUNK_MIN, Math.min(CHUNK_MAX, Number(m.mtu) || CHUNK_MIN));
  hasMotion = m.mot !== false;
  if (m.fw){
    firmware = m.fw;
    $('footVer').textContent = 'Breezedude Beacon ' + m.fw;
  }
  renderLink();
  if (m.v !== PROTOCOL) toast(t('versionMismatch'));
  send({ cmd: 'get' });
  if ($('dbgNmea').checked) listenNmea(true);
}

// The debug console's view of the NMEA stream: the same subscription a
// navigation app makes, so what shows up here is what such an app receives.
function listenNmea(on){
  return queued(async () => {
    if (!dev || !dev.gatt.connected) return;
    try {
      if (on && !nmeaChar){
        const srv = await dev.gatt.getPrimaryService(NUS);
        nmeaChar = await srv.getCharacteristic(NUS_TX);
        nmeaChar.oncharacteristicvaluechanged = lineReader(line => dbg('in', line));
      }
      if (nmeaChar) await (on ? nmeaChar.startNotifications() : nmeaChar.stopNotifications());
    } catch(e){ /* a debug aid; the session does not depend on it */ }
  });
}

// How far connect() got, shown when it fails: without it, "failed" says
// nothing about whether the beacon, the firmware or the browser is at fault.
let step = '';

async function connect(){
  dev.ongattserverdisconnected = () => {
    if (awaitingAuth) toast(t('notConfirmed'));
    setConnected(false);
  };

  step = 'gatt';
  const server = await dev.gatt.connect();
  step = 'service';
  const srv = await server.getPrimaryService(CFG_SVC);
  step = 'characteristic';
  rxChar = await srv.getCharacteristic(CFG_RX);
  const tx = await srv.getCharacteristic(CFG_TX);

  // Listener first, notifications second, otherwise the opening packets are
  // lost.
  step = 'notify';
  tx.oncharacteristicvaluechanged = lineReader(line => { dbg('in', line); onLine(line); });
  await tx.startNotifications();

  step = 'hello';
  keyTried = pairAsked = false;
  setConnected(true, dev.name);
  await hello();
}

$('connBtn').onclick = async () => {
  try {
    dev = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'Breezedude' }], optionalServices: [CFG_SVC, NUS] });
  } catch(e){ return; }                       // the chooser was dismissed
  try { await connect(); }
  catch(e){
    console.error(step, e);
    toast(t('connFailed') + ' (' + step + ')', 6000);
    if (dev.gatt.connected) dev.gatt.disconnect();
    setConnected(false);
  }
};
$('linkBtn').onclick = () => { if (dev && dev.gatt.connected) dev.gatt.disconnect(); };
$('bootBtn').onclick = () => {
  if (!confirm(t('bootConfirm'))) return;
  send({ cmd: 'bootloader' });
  toast(t('bootToast'));
};

// ---- incoming --------------------------------------------------------------
function onLine(line){
  let m;
  try { m = JSON.parse(line); } catch(e){ return; }
  // Anything this page does not know is left alone, so a newer firmware can
  // say more without breaking it.
  try {
    if (m.r === 'hello') onHello(m);
    if (m.r === 'cfg' && m.cfg) fillForm(m.cfg);
    if (m.r === 'status') showStatus(m);
    if (m.r === 'traffic' || m.r === 'weather' || m.r === 'name') addReception(m);
    if (m.r === 'saved') noteSaved(m.ok);
    if (m.r === 'auth')  onAuth(m);
  } catch(e){ /* a render error must never take the link down */ }
}

let savedTimer = null;
function noteSaved(ok){
  if (!ok){ toast(t('saveFailed')); return; }
  const el = $('savedNote');
  el.textContent = '· ' + t('saved');
  el.classList.add('on');
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

// ---- status ----------------------------------------------------------------
const fmtIdle = s => {
  s = Math.max(0, Math.round(s || 0));
  if (s < 60)   return s + ' s';
  if (s < 3600) return Math.floor(s / 60) + ' min';
  return Math.floor(s / 3600) + ' h ' + Math.floor((s % 3600) / 60) + ' min';
};

const PROTO = ['FLARM', 'FANET', 'ADS-L'];
let cfgNow = {};
let lastStatus = null;

const chip = (label, on, count) =>
  '<span class="chip' + (on ? ' on' : '') + '"><span class=dot></span>' + label +
  (on && count !== undefined ? ' <span class=n>' + count + '</span>' : '') + '</span>';

function showStatus(m){
  lastStatus = m;
  const fix = !!m.fix;
  $('stFix').innerHTML = fix ? '<i class="led ok"></i>Fix'
                             : '<i class="led wait"></i><span class=dim>' + t('searching') + '</span>';
  $('stSat').textContent = String(m.sat ?? 0);
  $('stBat').innerHTML  = (m.batP !== undefined ? m.batP + ' %' : '–') +
    (m.bat !== undefined ? ' <small>' + m.bat + ' V</small>' : '') +
    (m.chg ? ' <small>' + t('charging') + '</small>' : '');
  const pct = Math.max(0, Math.min(100, Number(m.batP) || 0));
  $('batGauge').className = 'gauge' + (pct < 15 ? ' low' : pct < 35 ? ' mid' : '');
  $('batGauge').firstElementChild.style.width = pct + '%';
  $('stIdle').textContent = !hasMotion ? t('noSensor')
                          : (m.noMot !== undefined ? fmtIdle(m.noMot) : '–');
  $('stPos').innerHTML = fix
    ? (m.alt ?? '–') + ' m <small>' + (m.spd ?? '–') + ' km/h · ' + (m.hdg ?? '–') + '°</small>'
    : '<span class=dim>' + t('noPosition') + '</span>';

  // Five decimals is about a metre, which is as much as this receiver can
  // honestly claim; more digits would only look precise.
  const havePos = fix && m.lat !== undefined && m.lon !== undefined;
  $('stCoord').textContent = havePos
    ? Number(m.lat).toFixed(5) + ', ' + Number(m.lon).toFixed(5)
    : '–';

  // Distances are relative to where we are now, so they follow the aircraft
  // rather than being frozen at the moment each station was heard.
  const moved = !ownPos || !havePos ||
                Math.abs(ownPos.lat - m.lat) > 1e-5 || Math.abs(ownPos.lon - m.lon) > 1e-5;
  ownPos = havePos ? { lat: Number(m.lat), lon: Number(m.lon) } : null;
  if (moved && rxSeen.size && $('rxBox').open) renderReceptions();

  // Transmit and receive on separate rows, so which is which needs no reading.
  $('txChips').innerHTML = chip('FANET', !!cfgNow.fanet, m.tx) +
                           chip('FLARM', !!cfgNow.flarm, m.txF) +
                           chip('ADS-L', !!cfgNow.adsl,  m.txA);
  $('rxChips').innerHTML = cfgNow.rxOn
    ? chip(PROTO[cfgNow.rxProto || 0], true, rxSeen.size)
    : '<span class=chip><span class=dot></span>' + t('off') + '</span>';

  const active = ['fanet','flarm','adsl'].filter(k => cfgNow[k]).length;
  $('txTally').textContent = active ? t('nActive', active) : t('off');
}
redraw.push(() => { if (lastStatus) showStatus(lastStatus); });

// ---- received stations -----------------------------------------------------
const rxSeen = new Map();

// Names arrive in their own frames, minutes apart from the position they
// belong to, so they are kept aside and applied to whatever is on record for
// that address. Twenty is more than a busy sky produces within radio range.
const rxNames = new Map();
const RX_NAME_MAX = 20;

function rememberName(id, name){
  const clean = String(name || '').replace(/[<>]/g, '').trim();
  if (!clean) return;
  rxNames.delete(id);                       // re-insert so it counts as recent
  rxNames.set(id, clean);
  while (rxNames.size > RX_NAME_MAX) rxNames.delete(rxNames.keys().next().value);
}

// Our own position, kept so that received stations can be shown as a distance
// rather than as coordinates nobody can picture.
let ownPos = null;

function distanceM(lat1, lon1, lat2, lon2){
  const R = 6371000, rad = Math.PI / 180;
  const mLat = (lat1 + lat2) / 2 * rad;
  const dLat = (lat2 - lat1) * rad;
  const dLon = (lon2 - lon1) * rad * Math.cos(mLat);
  return Math.sqrt(dLat * dLat + dLon * dLon) * R;
}

// Below a kilometre metres are what matters, above it they are noise.
const fmtDist = m => m < 1000 ? Math.round(m / 10) * 10 + ' m'
                              : (m / 1000).toFixed(m < 10000 ? 1 : 0) + ' km';
const hexId = v => '0x' + Number(v || 0).toString(16).toUpperCase().padStart(6, '0');

function addReception(m){
  // Keyed on the address alone: a weather station that also sends its name is
  // one station, not two entries that happen to share a number.
  const key = m.id;
  const prev = rxSeen.get(key) || {};
  const entry = Object.assign({}, prev, { id: m.id });

  // What was received is kept as it came, and turned into words when it is
  // drawn, so the list follows a change of language.
  if (m.r === 'weather')      entry.weather = m;
  else if (m.r === 'traffic') entry.traffic = m;
  else                        rememberName(m.id, m.name);

  // A frame that does not carry a value must not erase the one on record: a
  // name says nothing about where the station is or how well it was heard.
  if (m.lat  !== undefined){ entry.lat = Number(m.lat); entry.lon = Number(m.lon); }
  if (m.rssi !== undefined) entry.rssi = m.rssi;

  // A report replayed from the device when the session opened says how long
  // ago it was heard, so it does not appear as if it had just come in.
  const at = Date.now() - (Number(m.age) || 0) * 1000;
  entry.at = Math.max(at, prev.at || 0);

  rxSeen.set(key, entry);
  renderReceptions();
}

function describeReception(v){
  if (v.weather){
    const m = v.weather, p = [];
    if (m.temp  !== undefined) p.push(m.temp + ' °C');
    if (m.wind  !== undefined) p.push(t('wind', m.wind, m.wdir ?? '?'));
    if (m.gust  !== undefined) p.push(t('gusts', m.gust));
    if (m.hum   !== undefined) p.push(t('humidity', m.hum));
    if (m.press !== undefined) p.push(m.press + ' hPa');
    if (m.bat   !== undefined) p.push(t('batteryPct', m.bat));
    return { tag: t('weather'), body: p.join(' · ') || t('noReadings') };
  }
  if (v.traffic){
    const m = v.traffic, p = [];
    if (m.lat !== undefined) p.push(Number(m.lat).toFixed(4) + ', ' + Number(m.lon).toFixed(4));
    if (m.alt !== undefined) p.push(m.alt + ' m');
    if (m.spd !== undefined) p.push(m.spd + ' km/h');
    if (m.clb !== undefined) p.push((m.clb > 0 ? '+' : '') + m.clb + ' m/s');
    return { tag: m.src || 'RF',
             body: (t('acft')[m.type] || t('unknown')) + (p.length ? ' · ' + p.join(' · ') : '') };
  }
  return { tag: 'RF', body: t('nameOnly') };
}

function renderReceptions(){
  // Nearest first while we know where we are, most recent first otherwise:
  // when something is close by, that matters more than when it was heard.
  const items = [...rxSeen.values()].sort((a, b) => {
    if (ownPos){
      const da = (a.lat !== undefined) ? distanceM(ownPos.lat, ownPos.lon, a.lat, a.lon) : Infinity;
      const db = (b.lat !== undefined) ? distanceM(ownPos.lat, ownPos.lon, b.lat, b.lon) : Infinity;
      if (da !== db) return da - db;
    }
    return b.at - a.at;
  }).slice(0, 25);
  $('rxTally').textContent = items.length || '–';
  renderRxTally();

  const box = $('rxList');
  if (!items.length){ box.innerHTML = '<div class=rxempty>' + t('nothingHeard') + '</div>'; return; }

  const now = Date.now();
  box.innerHTML = items.map(v => {
    const age  = Math.round((now - v.at) / 1000);
    const rssi = (v.rssi !== undefined && v.rssi !== 0) ? ' · ' + v.rssi + ' dBm' : '';
    // Without our own fix there is nothing to measure from, so the distance is
    // left out rather than guessed.
    const dist = (ownPos && v.lat !== undefined && v.lon !== undefined)
      ? '<span class=dist>' + fmtDist(distanceM(ownPos.lat, ownPos.lon, v.lat, v.lon)) + '</span>'
      : '';
    // Looked up now rather than stored: a name that arrives later belongs to
    // everything already on record for that address.
    const name = rxNames.get(v.id);
    const title = hexId(v.id) + (name ? ' <span class=nm>' + name + '</span>' : '');
    const d = describeReception(v);
    return '<div class=rxi><div class=hd><span class=tag>' + d.tag + '</span>' +
           '<span class=id>' + title + '</span>' + dist + '</div>' +
           '<div class=mt>' + d.body + '</div>' +
           '<div class=mt>' + t('ago', age) + rssi + '</div></div>';
  }).join('');
}
redraw.push(renderReceptions);

// Ages the list and drops stations that went quiet.
setInterval(() => {
  if (!rxSeen.size) return;
  const cutoff = Date.now() - 300000;
  for (const [k, v] of rxSeen) if (v.at < cutoff) rxSeen.delete(k);
  if ($('rxBox').open) renderReceptions();
}, 5000);

// ---- form ------------------------------------------------------------------
const PLAIN = ['pilot','acType','online','fanet','flarm','adsl','lbt','adslTable','gnssVrtc','rxOn','rxProto'];
const HEXF  = { vendor: 2, devId: 4, fVendor: 2, fDevId: 4, adslAddr: 6 };

const hex   = (v, d) => '0x' + Number(v || 0).toString(16).toUpperCase().padStart(d, '0');
const unhex = s => { const n = parseInt(String(s).trim().replace(/^0x/i, ''), 16); return isNaN(n) ? 0 : n; };

let filling = false;

function fillForm(c){
  filling = true;
  cfgNow = Object.assign({}, cfgNow, c);

  for (const k of PLAIN){
    const el = $(k); if (!el || c[k] === undefined) continue;
    if (el.type === 'checkbox') el.checked = !!c[k]; else el.value = c[k];
  }
  for (const [k, d] of Object.entries(HEXF))
    if (c[k] !== undefined && $(k)) $(k).value = hex(c[k], d);

  if (c.trackMs    !== undefined) $('trackS').value     = String(c.trackMs / 1000);
  if (c.nameMs     !== undefined) $('nameS').value      = Math.round(c.nameMs / 1000);
  if (c.txPower    !== undefined) $('txPower').value    = c.txPower;
  if (c.buzzer     !== undefined) $('buzzer').value     = c.buzzer;
  if (c.lowVoltMv  !== undefined) $('lowVoltV').value   = (c.lowVoltMv / 1000).toFixed(2);
  if (c.autoOffMin !== undefined) $('autoOffMin').value = c.autoOffMin;
  if (c.fProto     !== undefined){
    const r = document.querySelector('#fProtoSeg input[value="' + c.fProto + '"]');
    if (r) r.checked = true;
  }

  refreshOutputs();
  syncRx();
  filling = false;
}

function refreshOutputs(){
  const p = Number($('txPower').value || 0);
  $('txPowerOut').textContent = p + ' dBm · ' +
    t('power')[p <= 0 ? 0 : p <= 10 ? 1 : p <= 17 ? 2 : 3];
  const v = Number($('buzzer').value || 0);
  $('buzzerOut').textContent = v + ' % · ' +
    t('volume')[v === 0 ? 0 : v <= 30 ? 1 : v <= 70 ? 2 : 3];
}
redraw.push(refreshOutputs);

function syncRx(){
  const on = $('rxOn').checked;
  $('rxProtoRow').style.opacity = on ? '1' : '.45';
  $('rxProto').disabled = !on;
  renderRxTally();
}

function renderRxTally(){
  const on = $('rxOn').checked;
  const n  = rxSeen.size;
  $('rxTally2').textContent = !on ? t('off')
    : PROTO[Number($('rxProto').value) || 0] + (n ? ' · ' + n : '');
}

function valid(){
  let ok = true;
  for (const [k, d] of Object.entries(HEXF)){
    const el = $(k); if (!el) continue;
    const bad = !new RegExp('^0x[0-9a-fA-F]{1,' + d + '}$').test(el.value.trim());
    el.classList.toggle('bad', bad);
    if (bad) ok = false;
  }
  for (const k of ['trackS','nameS','lowVoltV','autoOffMin']){
    const el = $(k);
    const n = Number(el.value);
    const bad = el.value === '' || isNaN(n) || n < Number(el.min) || n > Number(el.max);
    el.classList.toggle('bad', bad);
    if (bad) ok = false;
  }
  return ok;
}

function collect(){
  const c = {};
  for (const k of PLAIN){
    const el = $(k); if (!el) continue;
    c[k] = el.type === 'checkbox' ? el.checked
         : el.tagName === 'SELECT' ? Number(el.value)
         : el.value;
  }
  for (const k of Object.keys(HEXF)) if ($(k)) c[k] = unhex($(k).value);

  c.trackMs    = Math.round(parseFloat($('trackS').value) * 1000);
  c.nameMs     = Math.round(parseFloat($('nameS').value) * 1000);
  c.txPower    = Number($('txPower').value);
  c.buzzer     = Number($('buzzer').value);
  c.lowVoltMv  = Math.round(parseFloat($('lowVoltV').value) * 1000);
  c.autoOffMin = Number($('autoOffMin').value);
  const fp = document.querySelector('#fProtoSeg input:checked');
  if (fp) c.fProto = Number(fp.value);
  return c;
}

// Every change goes straight to the device. The firmware keeps it in RAM and
// writes it to flash when the link closes or the device is switched off, so
// there is no save step that can be forgotten.
let pushTimer = null;
function push(immediate){
  if (filling || !rxChar) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    if (!valid()){ toast(t('checkInput')); return; }
    const c = collect();
    cfgNow = Object.assign({}, cfgNow, c);
    send({ cmd: 'set', cfg: c });
  }, immediate ? 0 : 600);
}

// Switches and selects apply at once; typing waits until it settles.
document.addEventListener('change', e => {
  const el = e.target;
  if (!el.id && el.name !== 'fProto') return;
  if (el.id.startsWith('dbg')) return;     // console switches, not settings
  if (el.id === 'rxOn' || el.id === 'rxProto') syncRx();
  if (el.id === 'buzzer') send({ cmd: 'beep', vol: Number($('buzzer').value) });
  push(el.type !== 'text' && el.type !== 'number');
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'txPower' || el.id === 'buzzer') refreshOutputs();
  if (el.type === 'text' || el.type === 'number') push(false);
});

dbgClear();
setConnected(false);
applyLanguage();
setDebug(dbgOn);
</script>
